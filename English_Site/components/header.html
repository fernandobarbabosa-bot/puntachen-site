<header class="site-header" data-site-header>
  <a class="skip-link" href="#contenido-principal">Saltar al contenido principal</a>

  <div class="site-header__inner">
    <a class="site-header__brand" href="{{ROOT}}index.html" aria-label="Grupo Punta Chen">
      <img
        class="site-header__logo"
        src="/assets/logos/logo-grupo-punta-chen.png"
        alt="Grupo Punta Chen"
        width="96"
        height="96"
      >
    </a>

    <button
      class="site-header__toggle"
      type="button"
      aria-label="Abrir menu de navegacion"
      aria-controls="site-navigation"
      aria-expanded="false"
      data-menu-toggle
    >
      <span class="site-header__toggle-line"></span>
      <span class="site-header__toggle-line"></span>
      <span class="site-header__toggle-line"></span>
    </button>

    <nav
      class="site-header__nav"
      id="site-navigation"
      aria-label="Navegacion principal"
      aria-hidden="true"
      data-site-nav
    >
      <div class="site-header__nav-panel">
        <ul class="site-header__nav-list">
          <li><a class="site-header__nav-link" href="{{ROOT}}index.html">HOME</a></li>
          <li><a class="site-header__nav-link" href="{{PAGES}}infraestructura.html">INFRASTRUCTURE</a></li>
          <li><a class="site-header__nav-link" href="{{PAGES}}cooperativa.html">COOPERATIVE</a></li>
          <li><a class="site-header__nav-link" href="{{PAGES}}purificadora.html">PURIFICATION</a></li>
          <li><a class="site-header__nav-link" href="{{PAGES}}contacto.html">CONTACT</a></li>
        </ul>
       <div class="site-header__language" aria-label="Select language">
          <a
            class="site-header__language-link"
            href="{{LANGUAGE_PAGE}}"
            lang="es"
            aria-label="Español"
          >ES</a>

          <span class="site-header__language-divider" aria-hidden="true">|</span>

          <a
            class="site-header__language-link is-active"
            href="{{CURRENT_PAGE}}"
            lang="en"
            aria-label="English"
            aria-current="page"
          >EN</a>
        </div>
      </div>
    </nav>
</header>
